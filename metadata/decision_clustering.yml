portee: "Partition descriptive exploratoire, séparation et stabilité faibles ; aucune typologie naturelle validée."
justification: "Deux classes de 915 et 548 individus : lecture simple d'un niveau général de pratiques ; meilleure silhouette observée (0.142), meilleure stabilité moyenne relative mais faible (ARI 0.290). Les subdivisions ajoutent des contrastes moins stables et une complexité peu justifiée."
interpretations:
