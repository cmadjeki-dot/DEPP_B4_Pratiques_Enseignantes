  '3': "Ajoute un contraste EXP/EVA relativement plus élevés et NUM/DEV plus faibles ; silhouette et stabilité moyennes diminuent."
  '4': "Scinde davantage le groupe à niveaux généralement plus faibles ; contrastes de contenu possibles mais séparation faible."
  '5': "Isole notamment DIF/EVA relativement élevés avec COL plus faible ; groupe minimal de 140, stabilité réduite."
  '6': "Distingue davantage COL/DEV et NUM ; groupe minimal de 122 et stabilité moyenne la plus faible."
